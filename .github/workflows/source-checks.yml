name: Source-only checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.102'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify public snapshot boundary and hashes
        run: python tools/check_public_snapshot.py
      - name: Build source without catalogs
        run: |
          dotnet build Foundation.csproj --configuration Release
          dotnet build Desktop/RiseWorkshop.csproj --configuration Release
      - name: Run catalog-independent synthetic suites
        shell: pwsh
        run: |
          $nsSyntheticRoot = Join-Path $env:RUNNER_TEMP 'rise-public-synthetic'
          New-Item -ItemType Directory -Path $nsSyntheticRoot -Force | Out-Null
          $nsAssembly = Join-Path $env:GITHUB_WORKSPACE 'bin/Release/net10.0/Foundation.dll'
          Push-Location $nsSyntheticRoot
          try {
            foreach ($nsSuite in @('--self-test-history', '--self-test-r9', '--self-test-r5', '--self-test-catalog', '--self-test-r10-model', '--self-test-r11')) {
              dotnet $nsAssembly $nsSuite
              if ($LASTEXITCODE -ne 0) { throw "Synthetic suite failed: $nsSuite" }
            }
          } finally { Pop-Location }

# No catalog downloads, real saves, desktop smoke, uploads or deployment secrets.
# R10/provider resource tests require the excluded actual catalog and are skipped.
